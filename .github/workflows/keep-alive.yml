name: Keep free services alive

# Two separate free-tier "gotchas" this solves, per DEPLOYMENT.md /
# foot_database.md §31/§32:
#   1. Render's free Web Service sleeps after ~15 min idle.
#   2. Supabase's free project auto-pauses after 7 days with zero requests
#      (and pausing needs a manual "unpause" click in the dashboard to
#      recover from - not something that should ever be allowed to happen
#      to a project meant to "just work" while the PC is off).
# Runs entirely on GitHub Actions, which is free/unlimited for public repos
# - no UptimeRobot/cron-service account needed, matching Rule 0 in
# foot_database.md (no silent paid dependency, no extra signup either).

on:
  schedule:
    # Every 10 minutes - comfortably under Render's ~15 min sleep window.
    # Also satisfies Supabase's 7-day pause window many times over.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render socket server /health
        run: curl -fsS https://football-minds-socket.onrender.com/health || echo "Render ping failed (non-fatal, will retry in 10 min)"

      - name: Ping Supabase REST API (keeps the project from auto-pausing)
        run: |
          curl -fsS "https://ymtyqdmaifmqkwllnogr.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            || echo "Supabase ping failed (non-fatal, will retry in 10 min)"
